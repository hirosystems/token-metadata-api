name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.0 or 1.3.0-beta.0)'
        required: true
        type: string

jobs:
  verify:
    # Only `main` may be released, and the checked-out commit must already carry the requested
    # version so the artifacts and the tag can never disagree.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Check package versions match the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for pkg in package.json client/package.json; do
            actual="$(jq -r .version "$pkg")"
            if [[ "$actual" != "$VERSION" ]]; then
              echo "::error::$pkg is at $actual but release $VERSION was requested (commit ${GITHUB_SHA})"
              exit 1
            fi
          done

      - name: Check tag does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::tag v${VERSION} already exists; it must be created by publishing the draft release"
            exit 1
          fi

  publish-docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Tag release commit locally for version metadata
        run: git tag "v${{ inputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build/Tag/Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          push: true

  publish-npm:
    runs-on: ubuntu-latest
    needs: publish-docker
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Tag release commit locally for version metadata
        run: git tag "v${{ inputs.version }}"

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install deps
        run: npm ci --audit=false

      - name: Install client deps
        run: npm ci --audit=false
        working-directory: client

      - name: Publish client to npm
        run: npm publish --provenance --access public
        working-directory: client

  github-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}

      - name: Create draft GitHub Release (tag is created on publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if echo "$VERSION" | grep -q "-"; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # No tag is created for a draft; GitHub creates `v$VERSION` at
          # `$GITHUB_SHA` when the draft is published. The notes are generated
          # against the release commit and the API computes the previous tag.
          gh release create "v$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $PRERELEASE_FLAG
